name: Check Collaborator Permission

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  check-permission:
    runs-on: ubuntu-latest
    steps:
      - name: Check Collaborator Permission oppia-android-fork
        run: |
          PERMISSION=$(curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                           -H "Accept: application/vnd.github.v3+json" \
                           https://api.github.com/repos/Rd4dev/Oppia-Android-Fork-from-Fork/collaborators/${{ github.actor }}/permission)
          echo "User Permission Response: $PERMISSION"

